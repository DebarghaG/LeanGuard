name: Remote framework integrations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [dify, langflow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native engine
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update && lake exe cache get && lake build leanguard
      - name: Install isolated host and platform
        run: |
          python -m venv .host-venv
          .host-venv/bin/pip install -e '.[test,mcp]'
          python -m pip install -e 'integrations/platforms/python[test,${{ matrix.platform }}]'
      - run: python -m pytest -q integrations/platforms/tests/test_python.py
        env:
          LEANGUARD_PLATFORM: ${{ matrix.platform }}
          LEANGUARD_TEST_PYTHON: ${{ github.workspace }}/.host-venv/bin/python
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native engine
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update && lake exe cache get && lake build leanguard
      - run: python -m pip install -e '.[test,mcp]'
      - run: npm ci && npm run build
        working-directory: integrations/typescript
      - run: npm ci && npm run build && npm test
        working-directory: integrations/platforms/n8n
        env:
          LEANGUARD_TEST_PYTHON: python
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install native engine
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update && lake exe cache get && lake build leanguard
      - run: python -m pip install -e '.[test,mcp]'
      - run: mvn -B test
        working-directory: integrations/jvm
        env:
          LEANGUARD_TEST_PYTHON: python
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/typescript/package-lock.json
      - name: Install native engine
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update && lake exe cache get && lake build leanguard
      - run: python -m pip install -e '.[test,mcp]'
      - run: npm ci && npm run build && npm test
        working-directory: integrations/typescript
        env:
          LEANGUARD_TEST_PYTHON: python

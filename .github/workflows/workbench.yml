name: Policy workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    # Keep the runner compatible with the pinned Playwright browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/workbench/package-lock.json
      - name: Install native toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake update && lake exe cache get && lake build
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: tests/workbench
      - run: npx playwright install --with-deps chromium
        working-directory: tests/workbench
      - run: npm run format:check && npm test
        working-directory: tests/workbench
        env:
          LEANGUARD_TEST_PYTHON: python

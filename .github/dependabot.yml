version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /integrations/platforms/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /integrations/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /integrations/platforms/n8n
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /tests/workbench
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      playwright:
        patterns: [playwright, playwright-core]
  - package-ecosystem: maven
    directory: /integrations/jvm
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

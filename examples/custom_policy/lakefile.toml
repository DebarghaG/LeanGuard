name = "DocumentGuard"
defaultTargets = ["Guard", "GuardAudit", "document-guard"]

# In a separate repository, replace path with git and an immutable release rev.
[[require]]
name = "LeanGuard"
path = "../.."

[[lean_lib]]
name = "Guard"
roots = ["Guard", "GuardMain"]

[[lean_lib]]
name = "GuardAudit"

[[lean_exe]]
name = "document-guard"
root = "GuardMain"
